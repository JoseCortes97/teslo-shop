<h1 class="text-3xl font-bold font-raleway">
  Todos los productos para : <span class="text-secondary">{{ gender() | titlecase }}</span>
</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-2 gap-4">
  @for (product of productsResource.value()?.products; track $index) {
    <product-card [product]="product" />
  } @empty {
    <p>No hay priductos</p>
  }
</div>
<div class="flex justify-center p-4">
  <pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />
</div>
