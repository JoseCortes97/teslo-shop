@if (productResource.isLoading()) {
  <div class="flex justify-center item-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}
@if (productResource.hasValue()) {
  <div class="hero bg-base-200 w-full">
    <div class="hero-content flex-col lg:flex-row">
      <product-carousel [images]="productResource.value().images ?? []" />
      <!-- <img [src]="productResource.value()!.images | productImage" [alt]="productResource" /> -->

      <div>
        <h1 class="text-5xl font-bold">{{ productResource.value()!.title }}</h1>
        <p class="py-6">{{ productResource.value()!.description }}</p>
        <button class="btn btn-primary">Get Started</button>
      </div>
    </div>
  </div>
}
