<div class="flex justify-center">
  <form formGroup="loginForm" (ngSubmit)="login()">
    <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
      <legend class="fieldset-legend">Inicio de sesión</legend>

      <label class="label">Email</label>
      <input type="email" class="input" placeholder="Email" formControlName="email" />

      <label class="label">Password</label>
      <input type="password" class="input" placeholder="Password" formControlName="password" />

      <button type="submit" class="btn btn-neutral mt-4">Entrar</button>

      <p class="font-raleway content-end">
        ¿Aun no tienes cuenta?
        <a routerLink="/auth/register" class="link-accent cursor-pointer"> Registrate</a>
      </p>
    </fieldset>
  </form>
</div>
