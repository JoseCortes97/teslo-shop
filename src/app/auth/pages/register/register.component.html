<div class="flex justify-center">
  <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
    <legend class="fieldset-legend">Registro</legend>

    <label class="label">Email</label>
    <input type="email" class="input" placeholder="Email" />

    <label class="label">Password</label>
    <input type="password" class="input" placeholder="Password" />

    <button type="submit" class="btn btn-neutral mt-4">Entrar</button>

    <p class="font-raleway content-end">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="link-accent cursor-pointer"> Iniciar sesión</a>
    </p>
  </fieldset>
</div>
