<div class="overflow-x-auto">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>Name</th>
        <th>Job</th>
        <th>Favorite Color</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (product of products(); track $index) {
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <div class="avatar">
                <div class="mask mask-squircle h-12 w-12">
                  <img [src]="product.images[0] | productImage" [alt]="product.title" />
                </div>
              </div>
              <div>
                <a
                  [routerLink]="['/admin/products', product.id]"
                  class="font-bold hover:text-accent transition-colors duration-300"
                  >{{ product.title }}</a
                >

                <div class="text-sm opacity-50">{{ product.sizes.join(', ') }}</div>
              </div>
            </div>
          </td>
          <td>
            <span class="badge badge-ghost badge-sm">{{ product.price | currency }}</span>
          </td>
          <td class="text-center">
            @if (product.stock <= 10) {
              <span class="badge badge-error">{{ product.stock }}</span>
            }
            <!--  -->
            @else if (product.stock <= 20) {
              <span class="badge badge-warning">{{ product.stock }}</span>
            }
            <!--  -->
            @else {
              <span class="badge badge-success">{{ product.stock }}</span>
            }
          </td>
          <th>
            <button class="btn btn-ghost btn-xs">
              <a
                [routerLink]="['/admin/product', product.id]"
                class="btn btn-ghost text-accent btn-xs"
                >Ver producto</a
              >
            </button>
          </th>
        </tr>
      }
    </tbody>
  </table>
</div>
