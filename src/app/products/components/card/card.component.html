<div class="card bg-base-100 w-96 shadow-sm animate-fadeIn">
  <figure>
    <img [src]="product().images[0] ?? '' | productImage" [alt]="product().title" />
  </figure>
  <div class="card-body">
    <h2
      class="card-title text-accent font-raleway hover:underline cursor-pointer"
      [routerLink]="['/product', product().slug]"
    >
      {{ product().title }}
      <div class="badge badge-secondary">NEW</div>
    </h2>
    <p>{{ product().description | slice: 0 : 70 }}...</p>
    <div class="card-actions justify-end">
      <div class="badge badge-outline">
        <a [routerLink]="['/product', product().slug]">Ver más </a>
      </div>
    </div>
  </div>
</div>
