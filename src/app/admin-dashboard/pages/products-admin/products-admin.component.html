<div class="container p-5">
  <h1 class="text-2xl font-bold">Listado de productos</h1>
  <h3 class="text-lg">
    Total de productos <span class="text-accent">{{ productsResource.value()?.count }}</span>
  </h3>
  <div class="py-2 gap-2 flex flex-row">
    <div class="flex">
      <pagination
        [pages]="productsResource.value()?.pages ?? 0"
        [currentPage]="paginationService.currentPage()"
      />
      <select
        class="select select-bordered w-32 ml-5"
        (change)="perPage.set(+selectPerPage.value)"
        #selectPerPage
      >
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>
    <div class="flex flex-1 justify-end">
      <button routerLink="/admin/product/new" class="btn btn-primary">Nuevo</button>
    </div>
  </div>

  <product-table [products]="productsResource.value()?.products ?? []" />
</div>
